name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          # Build the Tests lib too: Tests/AxiomClosurePin.lean and
          # Tests/F5RegressionAxiomClosure.lean carry #guard_msgs-pinned
          # axiom closures, so CI fails on any axiom-surface drift.
          build-args: "Divisor Tests"
