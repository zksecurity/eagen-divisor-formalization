name = "Divisor"
defaultTargets = ["Divisor"]

[[lean_lib]]
name = "Divisor"
srcDir = "."
leanOptions = [
  { name = "pp.unicode.fun", value = true },
  { name = "autoImplicit", value = false },
  { name = "relaxedAutoImplicit", value = false },
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"
